<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Token Arcade · 雨夜小屋样板</title>
<style>
@font-face{font-family:'Fusion Pixel';src:url('./assets/fonts/fusion-pixel-12px-zh_hans.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#120d1b;overflow:hidden}#stage{width:100%;height:100%;display:block;touch-action:none;outline:none;image-rendering:pixelated}#preview-boot{position:fixed;inset:0;display:grid;place-items:center;color:#f4d793;background:#171322;font:24px 'Fusion Pixel',monospace}#controls,#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#controls:focus-within{width:auto;height:auto;left:16px;bottom:16px;right:16px;clip-path:none;background:#29162e;border:4px solid #986a48;padding:12px;display:flex;flex-wrap:wrap;gap:8px}#controls button{font:20px 'Fusion Pixel',monospace;background:#40283b;color:#f4d793;border:2px solid #986a48;padding:10px}#controls button:focus-visible{outline:3px solid #9fddc6}
