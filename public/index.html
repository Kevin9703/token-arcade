<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#eef0df" />
<meta name="description" content="把 AI token 变成一座自己的河谷小镇。建设街坊、照顾邻居、挑战规划，所有进度都留在本地。" />
<title>Token Town · 河谷小镇</title>
<link rel="stylesheet" href="./town.css" />
</head>
<body>
<canvas id="town-scene" aria-label="可拖动、缩放、旋转的河谷小镇。点击建筑查看需求，使用建设工具布置城镇。" tabindex="0"></canvas>
<main id="town-ui" aria-label="河谷小镇游戏"></main>
<div id="town-loading" role="status"><span>Token Town</span><h1>河谷正在醒来</h1><p>屋顶、树影，还有刚出炉的面包。</p></div>
<div id="graphics-error" class="hidden" role="alert"><h2>画面暂时中断了</h2><p>进度已经自动保存。请刷新页面重新连接。</p><button onclick="location.reload()">重新打开河谷</button></div>
<noscript>河谷小镇需要启用 JavaScript。</noscript>
<script src="./app.js"></script>
</body>
</html>
