<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Token Arcade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0712'/%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ffd23f'/%3E%3Cpath d='M5 6h6M8 6v5' stroke='%23c98f24' stroke-width='1.7' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Turn Claude Code and Codex token history into a playable pixel arcade."
    />
    <link rel="preload" href="./assets/boot/boot-power-chamber-v1.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./assets/boot/loading-frame-v1.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./assets/home-ui/logo-sign-v1-trimmed.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./assets/room-bg.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./assets/coin-bank.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./assets/prize-wall.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="ta-boot-layout">
        <img
          class="ta-boot-logo"
          src="./assets/home-ui/logo-sign-v1-trimmed.webp"
          alt="Token Arcade"
        />
        <div class="ta-boot-meter">
          <img
            class="ta-boot-meter-frame"
            src="./assets/boot/loading-frame-v1.webp"
            alt=""
            aria-hidden="true"
          />
          <div class="ta-boot-fill-window" aria-hidden="true">
            <span id="boot-progress"></span>
          </div>
          <div class="ta-boot-readout">
            <p id="boot-label">POWERING UP ARCADE</p>
            <span id="boot-percent">0%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- The whole arcade is rendered here. -->
    <canvas id="stage" aria-label="Token Arcade"></canvas>

    <!-- DOM overlays (help / settings modals, boot hint). Screens are canvas. -->
    <div id="overlays"></div>

    <noscript>Token Arcade needs JavaScript enabled.</noscript>
    <script src="./app.js"></script>
  </body>
</html>
